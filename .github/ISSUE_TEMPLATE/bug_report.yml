name: Bug Report
description: File a bug report
title: "[Bug]: <group> - <component> - "
labels: ["state-triage"]
type: bug
assignees:
  - gregjstewart
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! We take these seriously, and will look and comment as soon as we are able to triage.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what went wrong!
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: In what context(s) are you seeing this issue?
      description: What OS(s) are you using? What Browser(s)? Any other useful context surrounding how you are using the software?
  - type: textarea
    id: versions
    attributes:
      label: What version(s) of relevant components are used?
      description: What version of the erring software? What version of the underlying components? (for example, if the bug is for Base Station, what version of Core API is being used?)
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks. Reminder to not include sensitive information.
      render: shell
