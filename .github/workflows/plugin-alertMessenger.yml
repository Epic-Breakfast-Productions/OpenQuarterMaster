name: CI - Plugin - Alert Messenger

on:
    push:
        branches:
            - main
            - development
        paths:
            - "software/plugins/alert-messenger/**"
            - ".github/workflows/plugin-alertMessenger.yml"
    pull_request:
        paths:
            - "software/plugins/alert-messenger/**"
            - ".github/workflows/plugin-alertMessenger.yml"
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-plugin-alert-messenger-${{ github.ref }}
    cancel-in-progress: true

jobs:
    CI-Pipeline:
        uses: Epic-Breakfast-Productions/ebp-ci/.github/workflows/quarkus-ci-pipeline.yml@main
        with:
            project-name: Plugin - Alert Messenger
            path: "software/plugins/alert-messenger"
            java-version: "25"
            run-int-tests: true
            container-based-int-tests: false
