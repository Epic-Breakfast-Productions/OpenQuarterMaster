name: CI - Plugin - Storagotchi

on:
    push:
        branches:
            - main
            - development
        paths:
            - "software/plugins/storagotchi/**"
            - ".github/workflows/plugin-storagotchi.yml"
    pull_request:
        paths:
            - "software/plugins/storagotchi/**"
            - ".github/workflows/plugin-storagotchi.yml"
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-plugin-storagotchi-${{ github.ref }}
    cancel-in-progress: true

jobs:
    CI-Pipeline:
        uses: Epic-Breakfast-Productions/ebp-ci/.github/workflows/quarkus-ci-pipeline.yml@main
        with:
            project-name: Plugin - Storagotchi
            path: "software/plugins/storagotchi/"
            java-version: "25"
            run-int-tests: true
            container-based-int-tests: false
