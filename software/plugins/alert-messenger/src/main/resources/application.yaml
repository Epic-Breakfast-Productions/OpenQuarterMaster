quarkus:
    container-image:
        name: oqm-plugin-alert_messenger
        group: ebprod

    log:
        console:
            format: "%d{HH:mm:ss} [%-5p][%-16X{traceId}|%-2X{parentId}|%-16X{spanId}|%-5X{sampled}][%-40c{2.}|%-26t]():: %s%e%n"
        category:
            "io.quarkus.mailer":
                level: DEBUG
    oidc:
        application-type: hybrid
        token-state-manager:
            split-tokens: true
        logout:
            path: /logout

    rest-client:
        "oqm.core.api":
            url: "${oqm.core.api.baseUri}"
        "oqm.core.api-oidc":
            url: "${quarkus.oidc.auth-server-url}"

    mongodb:
        database: oqm-plugin-alert-messenger

