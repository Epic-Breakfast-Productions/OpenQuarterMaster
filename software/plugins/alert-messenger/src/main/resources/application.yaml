oqm:
    core:
        api:
            baseUri: "http://localhost:8080"

service:
    favicon-url: "https://openquartermaster.com/public/res/media/logo/Quarter%20Master%20Logo%20Symbol%20Outlined%20Square.png"
    encrypted-secret: ""
    old-encrypted-secret: ""
    # reset-mode defines what will happen when encrypted-secret is changed and application no loger can decrypt the data.
    # possible values are:
    # "none" (default): health check will fail and application will not start, but data will not be deleted.
    # "reset": reset all webhook values and deletes pointers, but keep the rest of the data.
    # "migrate": if you want to change the encrypted-secret, you can set this value to "migrate"
    # and the application will try to decrypt the data with the old-encrypted-secret and re-encrypt it with the new one.
    # If it fails, "none" (default) will be used and the application will not start.
    reset-mode: "none"
    throttle-interval: 15s

mp:
    messaging:
        incoming:
            oqm-core-all-events:
                connector: smallrye-kafka
                auto:
                    offset:
                        reset: earliest
#        value:
#          deserializer: tech.ebp.oqm.plugin.alertMessenger.ObjectNodeDeserializer

smallrye:
    jwt:
        always-check-authorization: true
        require-scope: false


"%dev":
    quarkus:
        devservices:
            enabled: false
        http:
            port: 5010
            ssl-port: 8443
        oidc:
            client-id: oqm-app
            credentials:
                secret: "**********"
            auth-server-url: "${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8100/realms/oqm}"
        mongodb:
            connection-string: mongodb://${MONGO_ROOT_USERNAME:oqmadmin}:${MONGO_ROOT_PASSWORD:superSecretPassword}@localhost:27017
            database: ${MONGO_DATABASE:oqm}
            devservices:
                enabled: false
        messaging:
            incoming:
                oqm-core-all-events:
                    bootstrap:
                        servers: localhost:19092
            log:
                category:
                    "io.quarkus.mailer":
                        level: DEBUG
                    "io.vertx.ext.mail":
                        level: DEBUG
                level: DEBUG
        log:
            level: DEBUG