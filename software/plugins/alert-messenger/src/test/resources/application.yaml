quarkus:
  log:
    category:
      "io.quarkus.mailer":
        level: DEBUG
  oidc:
    token-state-manager:
      encryption-required: false
    client-id: oqm-app
    credentials:
      secret: "**********"
  #      auth-server-url: http://localhost:8115/realms/oqm
  keycloak:
    devservices:
      enabled: true
      port: 8101
      realm-name: "oqm"
      realm-path: "dev/oqm-realm.json"
  kafka:
    devservices:
      enabled: true
      image-name: docker.io/redpandadata/redpanda:v26.2.7
  rest-client:
    "oqm.core.api":
      url: "${oqm.core.api.baseUri}"
  # Mailer configuration for Gmail SMTP server.
  mailer:
    auth-methods: "DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN"
    from: "oqm.alert.messenger@gmail.com"
    host: "smtp.gmail.com"
    port: 587
    ssl: false
    start-tls: REQUIRED
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    mock: false
oqm:
  core:
    api:
      baseUri: http://localhost:8080
      devservices:
        port: 8080
